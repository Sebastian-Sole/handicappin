name: Migrate Database

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  # Manual runs exist for two reasons the push trigger cannot serve:
  #
  #   1. DRIFT CHECK. With `apply: false` (the default) this job stops after the
  #      dry run and prints what production is missing, using the stored
  #      credentials — no local database connection, and no password handling on
  #      anyone's laptop. Note the direct host is IPv6-only, so `--linked` fails
  #      from most local networks; this is the reliable way to ask.
  #
  #   2. APPLY BEFORE MERGE. Some migrations must reach production BEFORE the code
  #      that depends on them deploys — merging first means the app queries a
  #      column that does not exist yet. Run this workflow on the PR's branch,
  #      verify the result against a dump, then merge.
  #
  # Running on a branch uses that branch's copy of this file, so a branch created
  # before this trigger existed must be rebased onto main before it can be used.
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the migrations. Leave unchecked to only report what is pending."
        type: boolean
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: ${{ github.workflow }}-migrate
      # Never cancel a run that may be mid-apply. `db push` wraps each migration
      # file in its own transaction, so an interrupted run leaves some files
      # applied and some not — recoverable, but it is drift, and drift on this
      # database has cost us before. Queue instead.
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Pin action and CLI version for reproducible builds. Update deliberately.
      - uses: supabase/setup-cli@v1.6.0
        with:
          version: 2.75.0

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SEND_EMAIL_HOOK_SECRET: ${{ secrets.SEND_EMAIL_HOOK_SECRET }}

      - name: Validate migrations (dry run)
        id: dry_run
        run: supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SEND_EMAIL_HOOK_SECRET: ${{ secrets.SEND_EMAIL_HOOK_SECRET }}

      # `success() &&` is load-bearing: a step's `if:` REPLACES the implicit
      # success() gate, so without it a failed dry run would no longer stop the
      # push — the opposite of what validating first is for.
      # `--yes` makes the no-prompt behavior explicit. Today's CLI happens to
      # auto-confirm when stdin is not a TTY, but a CLI that ever treated EOF
      # as "no" would silently skip the apply while this step still exits 0.
      - name: Push migrations to production
        id: apply
        if: ${{ success() && (github.event_name == 'push' || inputs.apply) }}
        run: supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SEND_EMAIL_HOOK_SECRET: ${{ secrets.SEND_EMAIL_HOOK_SECRET }}

      # Keyed on what the apply step ACTUALLY did, never on the trigger. An
      # intent-based summary would report "applied" for a run that failed
      # part-way, which is the one outcome most in need of an honest report.
      - name: Report what this run did
        if: always()
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          DRY_RUN_OUTCOME: ${{ steps.dry_run.outcome }}
          REF: ${{ github.ref_name }}
        run: |
          {
            case "$APPLY_OUTCOME" in
              success)
                echo "Migrations were applied to production from \`$REF\`."
                echo
                echo "Confirm the result against a database **dump**. Neither this log nor the migration history table is proof: a history row can exist for DDL that never ran."
                ;;
              failure)
                echo "### The apply failed part-way"
                echo
                echo "\`db push\` wraps each migration file in its own transaction but does **not** wrap the set, so production may now hold some of these migrations and not others."
                echo
                echo "Establish the real state from a **dump** before re-running — a second run trusts the history table, which is exactly what may now be wrong."
                ;;
              skipped)
                if [ "$DRY_RUN_OUTCOME" = "success" ]; then
                  echo "Report only — **nothing was applied**. The dry run above lists what production is missing."
                  echo
                  echo "Re-run with \`apply\` checked to push them."
                else
                  echo "**Nothing was applied** — the run did not get past validation. The failing step above says why."
                fi
                ;;
              *)
                echo "**Nothing was applied** — the run stopped before reaching the apply step."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
