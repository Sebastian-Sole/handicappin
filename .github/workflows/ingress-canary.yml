# Ingress canary — external synthetic tripwire for the Vercel/Cloudflare edge.
#
# WHY THIS EXISTS: on 2026-07-22 production was found serving a 429
# `x-vercel-mitigated: challenge` (Vercel Security Checkpoint HTML) to ALL
# cookie-less requests — breaking the native app's Bearer path and direct API
# calls. The outage went unnoticed because nothing external was probing the
# edge from OUTSIDE Vercel's network. This workflow is that probe. GitHub's
# hosted runners are NOT in Vercel's account boundary, so — unlike Vercel Cron
# Jobs / Functions, which Attack Mode auto-allows as "internal requests" — these
# requests are treated exactly like a real external cookie-less client (native
# app, cURL, a partner integration). If the challenge comes back, this run fails.
#
# STATUS: permanent infra (subplan 001 / W0). Alerting is wired below and
# activates once the SLACK_WEBHOOK_URL repo secret is set (OWNER action);
# until then a red run in the Actions tab is the signal.
#
# COVERAGE: handicappin.com (tRPC path) and api.handicappin.com (tRPC path +
# root) — the API host went live 2026-07-29 and is a hard gate.
#
# IS:     an external black-box reachability check for the public edge.
# IS NOT: a functional/business-logic test of tRPC or the API contract.

name: ingress-canary

on:
  schedule:
    # Every 15 minutes. GitHub cron is best-effort and can lag several minutes
    # under load — fine for a tripwire, do not treat cadence as SLA-grade.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Don't pile up overlapping runs if a scheduled tick is slow.
concurrency:
  group: ingress-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ------------------------------------------------------------------
      # PRIMARY: main-host tRPC public query, cookie-less.
      #
      # NOTE ON THE TARGET: the incident brief named `course.getAll`, which
      # does NOT exist. The public procedures on courseRouter are
      # getCourseById / searchCourses (needs query).
      # We use `course.getCourseById` with a trivial input —
      # it returns JSON (the course row or null) for any caller and needs no
      # auth. If that procedure is ever renamed, update TRPC_PATH below; any
      # public procedure that returns JSON works — the canary only cares that
      # the EDGE let us through, not what the app answered.
      # ------------------------------------------------------------------
      - name: Probe main host (handicappin.com/api/trpc)
        env:
          # tRPC v11 single-call GET. A superjson-wrapped input is used; if the
          # transformer ever changes the app still answers with JSON (a tRPC
          # input error is a PASS — it proves no challenge intercepted us).
          TRPC_PATH: "course.getCourseById"
          TRPC_INPUT: '{"json":{"courseId":1}}'
        run: |
          set -uo pipefail
          URL="https://handicappin.com/api/trpc/${TRPC_PATH}?input=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['TRPC_INPUT']))")"
          echo "Probing (cookie-less): $URL"

          # Capture headers and body separately. No cookies, real external IP.
          BODY_FILE="$(mktemp)"
          HEAD_FILE="$(mktemp)"
          HTTP_CODE="$(curl -sS -o "$BODY_FILE" -D "$HEAD_FILE" -w '%{http_code}' \
            --max-time 30 \
            -H 'Accept: application/json' \
            -A 'ingress-canary/1.0 (+github-actions external tripwire)' \
            "$URL" || echo "000")"

          echo "--- response status: $HTTP_CODE"
          echo "--- response headers:"; sed 's/^/    /' "$HEAD_FILE"
          echo "--- body (first 400 bytes):"; head -c 400 "$BODY_FILE" | sed 's/^/    /'; echo

          FAIL=0

          # (1) Definitive challenge signal — the exact header seen in the incident.
          if grep -iq '^x-vercel-mitigated:.*challenge' "$HEAD_FILE"; then
            echo "::error title=Ingress challenge active::x-vercel-mitigated: challenge on handicappin.com/api/trpc (cookie-less). The Vercel edge is challenging external clients — native app + API are broken."
            FAIL=1
          fi

          # (2) Blocked/challenged status codes where JSON was expected.
          if [ "$HTTP_CODE" = "429" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "::error title=Ingress blocked ($HTTP_CODE)::Expected JSON, got HTTP $HTTP_CODE from handicappin.com/api/trpc."
            FAIL=1
          fi
          if [ "$HTTP_CODE" = "000" ]; then
            echo "::error title=Ingress unreachable::curl could not complete a request to handicappin.com/api/trpc (timeout/DNS/TLS)."
            FAIL=1
          fi

          # (3) HTML where JSON was expected — the Security Checkpoint interstitial.
          if grep -iqE '<!doctype html|<html|Vercel Security Checkpoint|Attention Required' "$BODY_FILE"; then
            echo "::error title=Ingress served HTML::Body is an HTML interstitial (challenge/block page), not JSON."
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "CANARY FAILED — the public edge is not serving JSON to cookie-less clients."
            exit 1
          fi
          echo "CANARY OK — main host answered JSON to a cookie-less request (status $HTTP_CODE)."

      # ------------------------------------------------------------------
      # SECONDARY: the grey-clouded API host — LIVE since 2026-07-29
      # (DNS-only Cloudflare CNAME → Vercel, same project as www for now).
      # This is the future base URL for the public /api/v1 REST API (fitbull)
      # and the native app, so a challenge/block here is a HARD FAILURE —
      # no continue-on-error. Two probes:
      #   (a) the same public tRPC procedure as the main-host probe (JSON
      #       expected — proves the API path serves machine clients), and
      #   (b) the root `/` (the host currently serves the whole app, so 200
      #       HTML is the healthy answer; the check is that it's the APP's
      #       HTML, not a challenge interstitial).
      # TLS is asserted implicitly: curl verifies certificates by default, and
      # any TLS/DNS/timeout failure surfaces as HTTP_CODE=000 → hard fail.
      # ------------------------------------------------------------------
      - name: Probe API host (api.handicappin.com/api/trpc)
        env:
          TRPC_PATH: "course.getCourseById"
          TRPC_INPUT: '{"json":{"courseId":1}}'
        run: |
          set -uo pipefail
          URL="https://api.handicappin.com/api/trpc/${TRPC_PATH}?input=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['TRPC_INPUT']))")"
          echo "Probing (cookie-less): $URL"

          BODY_FILE="$(mktemp)"
          HEAD_FILE="$(mktemp)"
          HTTP_CODE="$(curl -sS -o "$BODY_FILE" -D "$HEAD_FILE" -w '%{http_code}' \
            --max-time 30 \
            -H 'Accept: application/json' \
            -A 'ingress-canary/1.0 (+github-actions external tripwire)' \
            "$URL" || echo "000")"

          echo "--- response status: $HTTP_CODE"
          echo "--- response headers:"; sed 's/^/    /' "$HEAD_FILE"
          echo "--- body (first 400 bytes):"; head -c 400 "$BODY_FILE" | sed 's/^/    /'; echo

          FAIL=0

          # (1) Definitive challenge signal — the exact header seen in the incident.
          if grep -iq '^x-vercel-mitigated:.*challenge' "$HEAD_FILE"; then
            echo "::error title=API host challenged::x-vercel-mitigated: challenge on api.handicappin.com/api/trpc (cookie-less). The grey-clouded API host is being challenged — fitbull + native Bearer paths are broken. This host must NEVER be challenged (see docs/ingress-firewall-state.md standing rule)."
            FAIL=1
          fi

          # (2) Blocked/challenged status codes where JSON was expected.
          if [ "$HTTP_CODE" = "429" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "::error title=API host blocked ($HTTP_CODE)::Expected JSON, got HTTP $HTTP_CODE from api.handicappin.com/api/trpc."
            FAIL=1
          fi
          if [ "$HTTP_CODE" = "000" ]; then
            echo "::error title=API host unreachable::curl could not complete a request to api.handicappin.com/api/trpc (timeout/DNS/TLS)."
            FAIL=1
          fi

          # (3) HTML where JSON was expected — the Security Checkpoint interstitial.
          if grep -iqE '<!doctype html|<html|Vercel Security Checkpoint|Attention Required' "$BODY_FILE"; then
            echo "::error title=API host served HTML::Body from api.handicappin.com/api/trpc is an HTML interstitial (challenge/block page), not JSON."
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "CANARY FAILED — api.handicappin.com is not serving JSON to cookie-less clients."
            exit 1
          fi
          echo "CANARY OK — API host answered JSON to a cookie-less request (status $HTTP_CODE)."

      - name: Probe API host root (api.handicappin.com/)
        run: |
          set -uo pipefail
          URL="https://api.handicappin.com/"
          echo "Probing (cookie-less): $URL"

          BODY_FILE="$(mktemp)"
          HEAD_FILE="$(mktemp)"
          HTTP_CODE="$(curl -sS -o "$BODY_FILE" -D "$HEAD_FILE" -w '%{http_code}' \
            --max-time 30 \
            -A 'ingress-canary/1.0 (+github-actions external tripwire)' \
            "$URL" || echo "000")"

          echo "--- response status: $HTTP_CODE"
          echo "--- response headers:"; sed 's/^/    /' "$HEAD_FILE"

          FAIL=0

          # (1) Definitive challenge signal.
          if grep -iq '^x-vercel-mitigated:.*challenge' "$HEAD_FILE"; then
            echo "::error title=API host root challenged::x-vercel-mitigated: challenge on api.handicappin.com/ (cookie-less)."
            FAIL=1
          fi

          # (2) Expected status is 200 (the host currently serves the whole
          # app at /). 429/403 = challenged/blocked; 000 = DNS/TLS/timeout;
          # anything else non-200 = the host stopped serving — all hard fails.
          # If the root's behavior is ever intentionally changed (e.g. a
          # redirect to API docs), update this assertion alongside.
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error title=API host root not serving 200::Expected HTTP 200 from api.handicappin.com/, got $HTTP_CODE."
            FAIL=1
          fi

          # (3) Root legitimately serves HTML, so only fail on the known
          # challenge/interstitial page markers — not on HTML per se.
          if grep -iqE 'Vercel Security Checkpoint|Attention Required' "$BODY_FILE"; then
            echo "::error title=API host root served interstitial::Body from api.handicappin.com/ is a challenge/block page."
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "CANARY FAILED — api.handicappin.com root is not healthy for cookie-less clients."
            exit 1
          fi
          echo "CANARY OK — API host root answered (status $HTTP_CODE, no challenge)."

      # ------------------------------------------------------------------
      # ALERTING: pages Slack within ~15 min when the edge regresses (someone
      # re-arms the challenge). No-op until the SLACK_WEBHOOK_URL repo secret
      # exists — OWNER: add an incoming-webhook URL as that secret to activate.
      # ------------------------------------------------------------------
      - name: Alert on failure (Slack)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning title=Canary alerting not wired::SLACK_WEBHOOK_URL secret is not set — this failure only shows in the Actions tab. Add the secret to page on canary failures."
            exit 0
          fi
          curl -sS -X POST -H 'Content-type: application/json' \
            --data '{"text":"INGRESS CANARY FAILED: handicappin.com or api.handicappin.com edge is not serving cookie-less clients (challenge regression / host down?). Check Vercel Firewall + docs/ingress-firewall-state.md + the INGRESS_RUNBOOK."}' \
            "$SLACK_WEBHOOK_URL"
